<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Piipunpeltien leikkauslaskuri</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 12px}.tabs{display:flex;gap:8px}.tab{border:0;border-radius:9px;padding:10px 18px;font-weight:bold;background:#374151;color:white}.tab.active{background:white;color:#111827}
main{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px}
.card{background:white;border-radius:12px;padding:14px;box-shadow:0 1px 5px #0001;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}.fields{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
label{font-size:14px}input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left}th{background:#f8fafc}
.badge{display:inline-block;padding:3px 7px;border-radius:10px;background:#e5e7eb;font-size:11px}.draw{overflow:auto}.draw svg{width:100%;min-width:500px;height:auto;background:#fff;border:1px solid #e5e7eb;border-radius:8px}.piece-card{border-top:1px solid #e5e7eb;padding:12px 0}.piece-card:first-child{border-top:0}.piece-card h3{font-size:15px;margin:0 0 8px}.piece-info{font-size:12px;color:#64748b;margin-top:6px}
.note{font-size:12px;color:#64748b}.hidden{display:none}
@media(max-width:760px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 120px}main{padding:9px}.card{padding:11px}}
</style>
</head>
<body>
<header><h1>Piipunpeltien leikkauslaskuri</h1><div class="tabs">
<button class="tab active" onclick="setMode('lape')">Lape</button>
<button class="tab" onclick="setMode('harja')">Harja</button>
</div></header>
<main>
<div class="grid">
<section>
<div class="card" id="lapeInputs">
<h2>Lape – mitat</h2><div class="fields">
<label>Piipun leveys (cm)</label><input id="B5" type="number" value="27" step=".1">
<label>Etukorkeus (cm)</label><input id="B6" type="number" value="42" step=".1">
<label>Takakorkeus (cm)</label><input id="B7" type="number" value="31" step=".1">
<label>Piipun syvyys (cm)</label><input id="B8" type="number" value="26" step=".1">
<label>Oikea sivuhelma (cm)</label><input id="B9" type="number" value="0" step=".1">
<label>Vasen sivuhelma (cm)</label><input id="B10" type="number" value="0" step=".1">
<label>Etuhelma (cm)</label><input id="B11" type="number" value="0" step=".1">
<label>Takahelma (cm)</label><input id="B12" type="number" value="0" step=".1">
<label>Piipun tyyppi</label><select id="B14"><option>IV</option><option>Savupiippu</option></select>
<label>Kattomateriaali</label><select id="B15"><option>T20</option><option>Classic</option><option>Tiilikainen</option><option>Huopa</option></select>
<label>Piipunhattu</label><select id="B16"><option>Ei</option><option>Kyllä</option></select>
<label>Hatun jalkojen määrä</label><input id="B17" type="number" value="2" min="0" step="1">
<label>Helman leveyden lisä</label><input id="B21" type="number" readonly>
<label>Helman pituuden lisä</label><input id="B22" type="number" readonly>
</div></div>
<div class="card hidden" id="harjaInputs">
<h2>Harja – mitat</h2><div class="fields">
<label>Piipun leveys (cm)</label><input id="B29" type="number" value="27" step=".1">
<label>Piipun syvyys (cm)</label><input id="B30" type="number" value="26" step=".1">
<label>Oikea helma (cm)</label><input id="B31" type="number" value="0" step=".1">
<label>Vasen helma (cm)</label><input id="B32" type="number" value="0" step=".1">
<label>1. päädyn korkeus (cm)</label><input id="B33" type="number" value="42" step=".1">
<label>2. päädyn korkeus (cm)</label><input id="B34" type="number" value="31" step=".1">
<label>Harjakohdan korkeus (cm)</label><input id="B35" type="number" value="50" step=".1">
<label>Harjakohdan etäisyys 1. päädystä</label><input id="B36" type="number" value="13" step=".1">
<label>Harjakohdan etäisyys 2. päädystä</label><input id="B37" type="number" value="13" step=".1">
<label>Etuhelma 1 (cm)</label><input id="B38" type="number" value="0" step=".1">
<label>Etuhelma 2 (cm)</label><input id="B39" type="number" value="0" step=".1">
<label>Kattomateriaali</label><select id="B41"><option>T20</option><option>Classic</option><option>Tiilikainen</option><option>Huopa</option></select>
<label>Piipun tyyppi</label><select id="B42"><option>IV</option><option>Savupiippu</option></select>
<label>Piipunhattu</label><select id="B43"><option>Ei</option><option>Kyllä</option></select>
<label>Hatun jalkojen määrä</label><input id="B44" type="number" value="2" min="0" step="1">
<label>Helman leveyden lisä</label><input id="B47" type="number" readonly>
<label>Helman pituuden lisä / pääty</label><input id="B48" type="number" readonly>
<label>Helman pituuden lisä yhteensä</label><input id="B49" type="number" readonly>
</div></div>
</section>

<section>
<div class="card"><h2>Leikkauslista <span id="total" class="badge"></span></h2>
<div id="cutlist"></div></div>
<div class="card"><h2>Mittakuvat</h2><p class="note">Kaikki valmistettavat palat näkyvät tässä. Mitat päivittyvät automaattisesti.</p><div id="allDrawings"></div></div>
</section>
</div>
</main>
<script>
let mode='lape';
const $=id=>document.getElementById(id), n=id=>+$(id).value||0;
function mat(m){return {T20:[5,2.5],Classic:[15,4],Tiilikainen:[8,2.5],Huopa:[2,1]}[m]}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(m==='lape'?i===0:i===1)));$('lapeInputs').classList.toggle('hidden',m!=='lape');$('harjaInputs').classList.toggle('hidden',m!=='harja');calc()}
document.addEventListener('input',calc);document.addEventListener('change',calc);
function splitPiece(name,w,h){
 if(w>125&&h>125)return [{name,w:125,h,seam:true},{name:name+' 2',w:w+3-125,h,seam:true}];
 return [{name,w,h,seam:false},{name:name+' 2',w:null,h:null,seam:false}];
}
function render(rows){
 let total=rows.reduce((s,r)=>s+(r.w&&r.h?r.w*r.h:0),0);
 $('total').textContent='Yhteensä '+(total/10000).toFixed(2)+' m²';
 let t='<table><tr><th>Pala</th><th>Leveys</th><th>Pituus/korkeus</th><th>m²</th><th>Sauma</th></tr>';
 rows.forEach(r=>t+=`<tr><td>${r.name}</td><td>${r.w==null?'':r.w.toFixed(1)}</td><td>${r.h==null?'':r.h.toFixed(1)}</td><td>${r.w&&r.h?(r.w*r.h/10000).toFixed(3):''}</td><td>${r.seam?'125 cm':'-'}</td></tr>`);
 $('cutlist').innerHTML=t+'</table><p class="note">Mitat cm. Jos sekä leveys että toinen mitta ylittävät 125 cm, pala jaetaan 125 cm:n kohdalta ja saumavaraan lisätään 3 cm.</p>'; renderAllDrawings();
}
function calc(){
 if(mode==='lape'){
  let [a,b]=mat($('B15').value);$('B21').value=a;$('B22').value=b;
  let w=n('B5'),fh=n('B6')+3.5,bh=n('B7')+3.5,d=n('B8');
  let rows=[];rows.push(...splitPiece('Etu',w+2,fh));rows.push(...splitPiece('Taka',w+4.5,bh));
  rows.push(...splitPiece('Sivut',d+3.5,Math.max(fh,bh)));rows.push(...splitPiece('Kansi',w+6.5,d+6.5));
  if($('B16').value==='Kyllä')rows.push(...splitPiece('Hattu',w+17,d+17));else rows.push({name:'Hattu',w:null,h:null},{name:'Hattu 2',w:null,h:null});
  if($('B16').value==='Kyllä'){let leg=d<w?d:w;leg+= $('B14').value==='IV'?28:48; rows.push(...splitPiece('Hatun jalka',12,leg));}else rows.push({name:'Hatun jalka',w:null,h:null},{name:'Hatun jalka 2',w:null,h:null});
  let hemW=w+n('B9')+n('B10')+a, hemL=n('B11')+Math.hypot(d+3.5,fh-bh)+n('B12')+b-3.5;
  rows.push(...splitPiece('Helma',hemW,hemL));render(rows);drawLape(w,fh,bh,d);
 }else{
  let [a,b]=mat($('B41').value);$('B47').value=a;$('B48').value=b;$('B49').value=b*2;
  let w=n('B29'),d=n('B30'),h1=n('B33')+3.5,h2=n('B34')+3.5;
  let rows=[];rows.push(...splitPiece('Pääty 1',w+5,h1));rows.push(...splitPiece('Pääty 2',w+5,h2));rows.push(...splitPiece('Sivut',d+2,Math.max(h1,h2)));rows.push(...splitPiece('Kansi',w+6.5,d+6.5));
  if($('B43').value==='Kyllä')rows.push(...splitPiece('Hattu',w+17,d+17));else rows.push({name:'Hattu',w:null,h:null},{name:'Hattu 2',w:null,h:null});
  if($('B43').value==='Kyllä'){let leg=Math.min(w,d)+($('B42').value==='IV'?27:47);rows.push(...splitPiece('Hatun jalka',12,leg));}else rows.push({name:'Hatun jalka',w:null,h:null},{name:'Hatun jalka 2',w:null,h:null});
  let hemW=w+n('B31')+n('B32')+a;
  let hemL=n('B38')+n('B39')+b*2+Math.hypot(n('B36')+1,n('B35')+3.5)+Math.hypot(n('B37')+1,n('B35')+3.5);
  rows.push(...splitPiece('Helma',hemW,hemL));render(rows);drawHarja(w,d,n('B33'),n('B34'),n('B35'),n('B36'),n('B37'));
 }
}

function svgBase(content){return `<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111827"/></marker></defs>${content}</svg>`}
function line(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111827" stroke-width="2"/>`}
function dim(x1,y1,x2,y2,val){
 const mx=(x1+x2)/2,my=(y1+y2)/2;
 return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111827" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
 <text x="${mx}" y="${my-8}" text-anchor="middle" font-size="16" font-family="Arial">${Number(val).toFixed(1)} cm</text>`;
}

function drawLapeSide(){
  const d=n('B8')+3.5, h1=n('B6')+3.5, h2=n('B7')+3.5;
  const x=125, base=320, sc=Math.min(500/d,210/Math.max(h1,h2)), W=d*sc,H1=h1*sc,H2=h2*sc;
  return svgBase(
    `<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Lape – sivupalan mittakuva</text>
     <polygon points="${x},${base} ${x},${base-H1} ${x+W},${base-H2} ${x+W},${base}" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
     ${dim(x,x+W,base+48,d)}
     ${dim(x-48,base-H1,x-48,base,h1)}
     ${dim(x+W+48,base-H2,x+W+48,base,h2)}
     <text x="380" y="405" text-anchor="middle" font-size="15">Etupään korkeus • Takapään korkeus • sivupalan leveys</text>`
  );
}
function drawHarjaSide(){
  const d=n('B30')+2, h1=n('B33')+3.5, h2=n('B34')+3.5, hr=n('B35')+3.5;
  const e1=n('B36'), e2=n('B37'), total=Math.max(e1+e2,d);
  const x=75, base=320, sc=Math.min(560/total,200/Math.max(h1,h2,hr)), W=total*sc;
  const peak=x+e1*sc,H1=h1*sc,H2=h2*sc,HR=hr*sc;
  return svgBase(
    `<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">Harja – sivupalan mittakuva</text>
     <polygon points="${x},${base} ${x},${base-H1} ${peak},${base-HR} ${x+W},${base-H2} ${x+W},${base}" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
     ${dim(x,peak,base+48,e1)}
     ${dim(peak,x+W,base+48,e2)}
     ${dim(x-48,base-H1,x-48,base,h1)}
     ${dim(peak+52,base-HR,peak+52,base,hr)}
     ${dim(x+W+48,base-H2,x+W+48,base,h2)}
     <text x="380" y="405" text-anchor="middle" font-size="15">1. päädyn korkeus • harjakohdan korkeus • 2. päädyn korkeus</text>`
  );
}
function rectDrawing(name,w,h){
  const x=170,y=85,sc=Math.min(410/(w||1),250/(h||1)),W=w*sc,H=h*sc;
  return svgBase(
    `<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold">${name}</text>
     <rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
     ${dim(x,x+W,y+H+45,w)}${dim(x-45,y,x-45,y+H,h)}`
  );
}
function renderAllDrawings(){
  const box=$('allDrawings'); if(!box)return;
  const visible=pieces.filter(p=>p.w&&p.h);
  if(!visible.length){box.innerHTML='<p class="note">Mittakuvat tulevat näkyviin, kun mitat on laskettu.</p>';return;}
  box.innerHTML=visible.map(p=>{
    let svg;
    if(mode==='lape' && p.name==='Sivut') svg=drawLapeSide();
    else if(mode==='harja' && p.name==='Sivut') svg=drawHarjaSide();
    else svg=rectDrawing(p.name,p.w,p.h);
    return `<div class="piece-card"><h3>${p.name}</h3><div class="draw">${svg}</div><div class="piece-info">Leikkausmitta: ${p.w.toFixed(1)} × ${p.h.toFixed(1)} cm${p.seam?' — saumallinen pala':''}</div></div>`;
  }).join('');
}

calc();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html><style>
#drawings{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
#drawings h3{grid-column:1/-1;margin:14px 0 0}.drawing-card{border:1px solid #ccc;border-radius:10px;padding:8px;background:#fff}.drawing-title{font-weight:700;margin-bottom:4px}.measure-svg{width:100%;height:auto}.measure-svg .shape{fill:none;stroke:#111;stroke-width:2}.measure-svg .aux{fill:none;stroke:#777;stroke-width:1;stroke-dasharray:5 4}.measure-svg .dim{fill:none;stroke:#222;stroke-width:1}.measure-svg text{font:12px Arial,sans-serif;fill:#111}
</style><script>
(function(){
function n(id){return parseFloat(document.getElementById(id)?.value)||0}function t(id){return (document.getElementById(id)?.value||'').toLowerCase()}
function svg(w,h,b){return '<svg class="measure-svg" viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg"><style>.shape{fill:none;stroke:#111;stroke-width:2}.aux{fill:none;stroke:#777;stroke-width:1;stroke-dasharray:5 4}.dim{fill:none;stroke:#222;stroke-width:1}.dim text{font:12px Arial,sans-serif;fill:#111}</style>'+b+'</svg>'}
function hd(x1,x2,y,label){var yy=y+22;return '<g class="dim"><line x1="'+x1+'" y1="'+yy+'" x2="'+x2+'" y2="'+yy+'"/><line x1="'+x1+'" y1="'+(yy-4)+'" x2="'+x1+'" y2="'+(yy+4)+'"/><line x1="'+x2+'" y1="'+(yy-4)+'" x2="'+x2+'" y2="'+(yy+4)+'"/><text x="'+((x1+x2)/2)+'" y="'+(yy-5)+'" text-anchor="middle">'+label+' cm</text></g>'}
function vd(x,y1,y2,label,side){var xx=x+25*side,m=(y1+y2)/2;return '<g class="dim"><line x1="'+xx+'" y1="'+y1+'" x2="'+xx+'" y2="'+y2+'"/><line x1="'+(xx-4)+'" y1="'+y1+'" x2="'+(xx+4)+'" y2="'+y1+'"/><line x1="'+(xx-4)+'" y1="'+y2+'" x2="'+(xx+4)+'" y2="'+y2+'"/><text x="'+(xx+6*side)+'" y="'+m+'" text-anchor="'+(side>0?'start':'end')+'" dominant-baseline="middle">'+label+' cm</text></g>'}
function card(title,s){return '<div class="drawing-card"><div class="drawing-title">'+title+'</div>'+s+'</div>'}
function rect(title,w,h){var W=340,H=210,p=45,sc=Math.min((W-2*p)/Math.max(w,1),(H-2*p)/Math.max(h,1)),rw=w*sc,rh=h*sc,x=(W-rw)/2,y=(H-rh)/2;return card(title,svg(W,H,'<rect class="shape" x="'+x+'" y="'+y+'" width="'+rw+'" height="'+rh+'"/>'+hd(x,x+rw,y+rh,w)+vd(x+rw,y,y+rh,h,1)))}
function lapSide(title,w,hi,lo){var W=370,H=230,p=50,sc=Math.min((W-2*p)/Math.max(w,1),(H-2*p)/Math.max(hi,1)),bw=w*sc,bh=hi*sc,bl=lo*sc,x=p,base=H-p,yhi=base-bh,ylo=base-bl;return card(title,svg(W,H,'<polygon class="shape" points="'+x+','+base+' '+(x+bw)+','+base+' '+(x+bw)+','+ylo+' '+x+','+yhi+'"/>'+hd(x,x+bw,base,w)+vd(x,base,yhi,hi,-1)+vd(x+bw,base,ylo,lo,1)))}
function harjaSide(title,w,h1,h2,r,dist1,dist2){var W=390,H=250,p=45,max=Math.max(h1,h2,r,1),sc=Math.min((W-2*p)/Math.max(w,1),(H-2*p)/max),bw=w*sc,x=p,base=H-p,y1=base-h1*sc,y2=base-h2*sc,yr=base-r*sc,xr=x+dist1*sc;return card(title,svg(W,H,'<polyline class="shape" points="'+x+','+base+' '+x+','+y1+' '+xr+','+yr+' '+(x+bw)+','+y2+' '+(x+bw)+','+base+' '+x+','+base+'"/><line class="aux" x1="'+xr+'" y1="'+base+'" x2="'+xr+'" y2="'+yr+'"/>'+hd(x,x+bw,base,w)+vd(x,base,y1,h1,-1)+vd(x+bw,base,y2,h2,1)+vd(xr,base,yr,r,1)+hd(x,xr,base,dist1)+hd(xr,x+bw,base,dist2)))}
function render(){var d=document.getElementById('drawings');if(!d)return;var o='';var w=n('b5'),hf=n('b6'),hb=n('b7'),dep=n('b8');if(w||hf||hb||dep){o+='<h3>Lapekaton mittakuvat</h3>'+rect('Etu',w+2,hf+3.5)+rect('Taka',w+4.5,hb+3.5)+lapSide('Sivu ×2',dep+3.5,Math.max(hf+3.5,hb+3.5),Math.min(hf+3.5,hb+3.5))+rect('Kansi',w+6.5,dep+6.5);if(t('b16').includes('kyll')||t('b16').includes('yes')){o+=rect('Hattu',w+17,dep+17);o+=rect('Hatun jalka',12,t('b14').includes('iv')?Math.min(w,dep)+28:Math.min(w,dep)+48)}var helW=w+n('b9')+n('b10')+n('b21'),helL=n('b11')+Math.hypot(dep+3.5,(hf+3.5)-(hb+3.5))+n('b12')+n('b22')-3.5;o+=rect('Helma',helW,helL)}var w2=n('b29'),d2=n('b30'),h1=n('b33'),h2=n('b34'),r=n('b35'),a=n('b36'),b=n('b37');if(w2||d2||h1||h2||r||a||b){o+='<h3>Harjakaton mittakuvat</h3>'+rect('Pääty 1',w2+5,h1+3.5)+rect('Pääty 2',w2+5,h2+3.5)+harjaSide('Sivu ×2',d2+2,h1+3.5,h2+3.5,r+3.5,a+1,b+1)+rect('Kansi',w2+6.5,d2+6.5);if(t('b43').includes('kyll')||t('b43').includes('yes')){o+=rect('Hattu',w2+17,d2+17);o+=rect('Hatun jalka',12,t('b42').includes('iv')?Math.min(w2,d2)+27:Math.min(w2,d2)+47)}var hw=w2+n('b31')+n('b32')+n('b47'),hl=n('b38')+n('b39')+n('b49')+Math.hypot(a+1,r+3.5)+Math.hypot(b+1,r+3.5);o+=rect('Helma',hw,hl)}d.innerHTML=o||'<div>Syötä mitat, niin mittakuvat näkyvät tässä.</div>'}
function init(){if(!document.getElementById('drawings')){var d=document.createElement('section');d.id='drawings';d.className='drawings';(document.querySelector('main')||document.body).appendChild(d)}render();document.addEventListener('input',render);document.addEventListener('change',render)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();})();
</script>
