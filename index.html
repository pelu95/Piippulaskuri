<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<title>Piipunpeltien leikkauslaskuri</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef1f5;color:#172033}
header{background:#111827;color:#fff;padding:14px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 10px}.tabs{display:flex;gap:8px}.tab{border:0;border-radius:9px;padding:10px 18px;font-weight:700;background:#374151;color:#fff}.tab.active{background:#fff;color:#111827}
main{max-width:1100px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:340px 1fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:13px;box-shadow:0 1px 5px #0001;margin-bottom:12px}
h2{font-size:17px;margin:0 0 12px}.fields{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
label{font-size:14px}input,select{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:left}th{background:#f8fafc}
.badge{display:inline-block;padding:3px 7px;border-radius:10px;background:#e5e7eb;font-size:11px}
.note{font-size:12px;color:#64748b}.hidden{display:none}
.drawtop{display:flex;gap:8px;align-items:center;margin-bottom:10px}.drawtop select{max-width:220px}
.draw svg{width:100%;min-width:520px;height:auto;background:#fff;border:1px solid #dbe1e8;border-radius:8px}.piece-card{padding:12px 0;border-bottom:2px solid #e5e7eb}.piece-card h3{font-size:16px;margin:4px 0 10px}.piece-card:last-child{border-bottom:0}
.draw{overflow:auto}.pieceinfo{font-size:13px;margin:8px 0 0;color:#475569}
@media(max-width:760px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr 120px}main{padding:8px}.card{padding:10px}}
</style>
</head>
<body>
<header><h1>Piipunpeltien leikkauslaskuri</h1><div class="tabs">
<button class="tab active" onclick="setMode('lape')">Lape</button>
<button class="tab" onclick="setMode('harja')">Harja</button>
</div></header>
<main><div class="grid"><section>
<div class="card" id="lapeInputs"><h2>Lape – mitat</h2><div class="fields">
<label>Piipun leveys (cm)</label><input id="B5" type="number" value="27" step=".1">
<label>Etukorkeus (cm)</label><input id="B6" type="number" value="42" step=".1">
<label>Takakorkeus (cm)</label><input id="B7" type="number" value="31" step=".1">
<label>Piipun syvyys (cm)</label><input id="B8" type="number" value="26" step=".1">
<label>Oikea sivuhelma (cm)</label><input id="B9" type="number" value="0" step=".1">
<label>Vasen sivuhelma (cm)</label><input id="B10" type="number" value="0" step=".1">
<label>Etuhelma (cm)</label><input id="B11" type="number" value="0" step=".1">
<label>Takahelma (cm)</label><input id="B12" type="number" value="0" step=".1">
<label>Piipun tyyppi</label><select id="B14"><option>IV</option><option>Savupiippu</option></select>
<label>Kattomateriaali</label><select id="B15"><option>T20</option><option>Classic</option><option>Tiilikainen</option><option>Huopa</option></select>
<label>Piipunhattu</label><select id="B16"><option>Ei</option><option>Kyllä</option></select>
<label>Hatun jalkojen määrä</label><input id="B17" type="number" value="2" min="0" step="1">
<label>Helman leveyden lisä</label><input id="B21" type="number" readonly>
<label>Helman pituuden lisä</label><input id="B22" type="number" readonly>
</div></div>

<div class="card hidden" id="harjaInputs"><h2>Harja – mitat</h2><div class="fields">
<label>Piipun leveys (cm)</label><input id="B29" type="number" value="27" step=".1">
<label>Piipun syvyys (cm)</label><input id="B30" type="number" value="26" step=".1">
<label>Oikea helma (cm)</label><input id="B31" type="number" value="0" step=".1">
<label>Vasen helma (cm)</label><input id="B32" type="number" value="0" step=".1">
<label>1. päädyn korkeus (cm)</label><input id="B33" type="number" value="42" step=".1">
<label>2. päädyn korkeus (cm)</label><input id="B34" type="number" value="31" step=".1">
<label>Harjakohdan korkeus (cm)</label><input id="B35" type="number" value="50" step=".1">
<label>Harjakohdan etäisyys 1. päädystä (cm)</label><input id="B36" type="number" value="13" step=".1">
<label>Harjakohdan etäisyys 2. päädystä (cm)</label><input id="B37" type="number" value="13" step=".1">
<label>Etuhelma 1 (cm)</label><input id="B38" type="number" value="0" step=".1">
<label>Etuhelma 2 (cm)</label><input id="B39" type="number" value="0" step=".1">
<label>Kattomateriaali</label><select id="B41"><option>T20</option><option>Classic</option><option>Tiilikainen</option><option>Huopa</option></select>
<label>Piipun tyyppi</label><select id="B42"><option>IV</option><option>Savupiippu</option></select>
<label>Piipunhattu</label><select id="B43"><option>Ei</option><option>Kyllä</option></select>
<label>Hatun jalkojen määrä</label><input id="B44" type="number" value="2" min="0" step="1">
<label>Helman leveyden lisä</label><input id="B47" type="number" readonly>
<label>Helman pituuden lisä / pääty</label><input id="B48" type="number" readonly>
<label>Helman pituuden lisä yhteensä</label><input id="B49" type="number" readonly>
</div></div>
</section>

<section>
<div class="card"><h2>Leikkauslista <span id="total" class="badge"></span></h2><div id="cutlist"></div></div>
<div class="card"><h2>Mittakuvat</h2>
<p class="note">Kaikkien valmistettavien palojen mittakuvat näkyvät alla. Mitat päivittyvät automaattisesti.</p><div id="allDrawings"></div>
</div>
</section></div></main>

<script>
let mode='lape', pieces=[];
const $=id=>document.getElementById(id), n=id=>+$(id).value||0;
function mat(m){return {T20:[5,2.5],Classic:[15,4],Tiilikainen:[8,2.5],Huopa:[2,1]}[m]}
function setMode(m){mode=m;document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(m==='lape'?i===0:i===1)));calc()}
document.addEventListener('input',calc);document.addEventListener('change',calc);
function splitPiece(name,w,h,shape='rect'){
 if(w>125&&h>125)return [{name,w:125,h,seam:true,shape},{name:name+' 2',w:w+3-125,h,seam:true,shape}];
 return [{name,w,h,seam:false,shape},{name:name+' 2',w:null,h:null,seam:false,shape}];
}
function render(rows){
 pieces=rows;
 let total=rows.reduce((s,r)=>s+(r.w&&r.h?r.w*r.h:0),0);
 $('total').textContent='Yhteensä '+(total/10000).toFixed(2)+' m²';
 let t='<table><tr><th>Pala</th><th>Leveys</th><th>Pituus/korkeus</th><th>m²</th><th>Sauma</th></tr>';
 rows.forEach((r,i)=>t+=`<tr><td>${r.name}</td><td>${r.w==null?'':r.w.toFixed(1)}</td><td>${r.h==null?'':r.h.toFixed(1)}</td><td>${r.w&&r.h?(r.w*r.h/10000).toFixed(3):''}</td><td>${r.seam?'125 cm + 3 cm':''}</td></tr>`);
 $('cutlist').innerHTML=t+'</table><p class="note">Mitat cm. Jos molemmat päämitat ylittävät 125 cm, pala jaetaan 125 cm:n kohdalta ja saumavaraa lisätään 3 cm.</p>';
 drawAll();
}
function calc(){
 if(mode==='lape'){
  let [a,b]=mat($('B15').value);$('B21').value=a;$('B22').value=b;
  let w=n('B5'),fh=n('B6')+3.5,bh=n('B7')+3.5,d=n('B8');
  let rows=[];
  rows.push(...splitPiece('Etu',w+2,fh,'rect'));
  rows.push(...splitPiece('Taka',w+4.5,bh,'rect'));
  rows.push(...splitPiece('Sivut',d+3.5,Math.max(fh,bh),'lapeSide'));
  rows.push(...splitPiece('Kansi',w+6.5,d+6.5,'rect'));
  if($('B16').value==='Kyllä')rows.push(...splitPiece('Hattu',w+17,d+17,'rect'));else rows.push({name:'Hattu',w:null,h:null},{name:'Hattu 2',w:null,h:null});
  if($('B16').value==='Kyllä'){let leg=Math.min(w,d)+($('B14').value==='IV'?28:48);rows.push(...splitPiece('Hatun jalka',12,leg,'rect'));}else rows.push({name:'Hatun jalka',w:null,h:null},{name:'Hatun jalka 2',w:null,h:null});
  let hemW=w+n('B9')+n('B10')+a, hemL=n('B11')+Math.hypot(d+3.5,fh-bh)+n('B12')+b-3.5;
  rows.push(...splitPiece('Helma',hemW,hemL,'rect'));
  render(rows);
 }else{
  let [a,b]=mat($('B41').value);$('B47').value=a;$('B48').value=b;$('B49').value=b*2;
  let w=n('B29'),d=n('B30'),h1=n('B33')+3.5,h2=n('B34')+3.5,hr=n('B35'),e1=n('B36'),e2=n('B37');
  let rows=[];
  rows.push(...splitPiece('Pääty 1',w+5,h1,'rect'));
  rows.push(...splitPiece('Pääty 2',w+5,h2,'rect'));
  rows.push(...splitPiece('Sivut',d+2,Math.max(h1,h2),'harjaSide'));
  rows.push(...splitPiece('Kansi',w+6.5,d+6.5,'rect'));
  if($('B43').value==='Kyllä')rows.push(...splitPiece('Hattu',w+17,d+17,'rect'));else rows.push({name:'Hattu',w:null,h:null},{name:'Hattu 2',w:null,h:null});
  if($('B43').value==='Kyllä'){let leg=Math.min(w,d)+($('B42').value==='IV'?27:47);rows.push(...splitPiece('Hatun jalka',12,leg,'rect'));}else rows.push({name:'Hatun jalka',w:null,h:null},{name:'Hatun jalka 2',w:null,h:null});
  let hemW=w+n('B31')+n('B32')+a;
  let hemL=n('B38')+n('B39')+b*2+Math.hypot(e1+1,hr+3.5)+Math.hypot(e2+1,hr+3.5);
  rows.push(...splitPiece('Helma',hemW,hemL,'rect'));
  render(rows);
 }
}
function base(content){return `<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#111827"/></marker></defs>${content}</svg>`}
function ln(x1,y1,x2,y2,dash=''){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#111827" stroke-width="2" ${dash?'stroke-dasharray="6 5"':''}/>`}
function txt(x,y,s,size=16,weight='normal',anchor='middle'){return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="${size}" font-weight="${weight}" font-family="Arial">${s}</text>`}
function dimH(x1,x2,y,s){return `${ln(x1,y,x2,y)}${txt((x1+x2)/2,y-8,s)}`}
function dimV(x,y1,y2,s,side=-1){return `${ln(x,y1,x,y2)}${txt(x+(side*12),(y1+y2)/2,s,15,'normal',side<0?'end':'start')}`}
function rectDraw(title,w,h,extra=''){
 let x=180,y=100,W=Math.min(390,w*2.0),H=Math.min(270,h*2.0),sc=Math.min(W/w,H/h);W=w*sc;H=h*sc;
 return base(txt(380,32,title,21,'bold')+`<rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#f8fafc" stroke="#111827" stroke-width="3"/>`+
 dimH(x,x+W,y+H+45,w.toFixed(1)+' cm')+dimV(x-45,y,y+H,h.toFixed(1)+' cm',-1)+extra);
}
function lapeSideDraw(){
 let d=n('B8')+3.5,hi=n('B6')+3.5,lo=n('B7')+3.5;
 let x=145,y=105,sc=Math.min(430/d,220/Math.max(hi,lo)),W=d*sc,H1=hi*sc,H2=lo*sc;
 let poly=`<polygon points="${x},${y} ${x+W},${y} ${x+W},${y+H2} ${x},${y+H1}" fill="#f8fafc" stroke="#111827" stroke-width="3"/>`;
 return base(txt(380,30,'Lape – sivupalan mittakuva',21,'bold')+poly+
 dimH(x,x+W,y-35,d.toFixed(1)+' cm')+
 dimV(x-55,y,y+H1,hi.toFixed(1)+' cm',-1)+
 dimV(x+W+55,y,y+H2,lo.toFixed(1)+' cm',1)+
 txt(380,430,'Etupään korkeus • Takapään korkeus • sivupalan leveys',15));
}
function harjaSideDraw(){
 let total=n('B30')+2, h1=n('B33')+3.5,h2=n('B34')+3.5,hr=n('B35')+3.5,e1=n('B36'),e2=n('B37');
 if(total<=0) total=e1+e2;
 let sc=Math.min(470/total,210/Math.max(h1,h2,hr)),x=115,y=100,W=total*sc,H1=h1*sc,H2=h2*sc,HR=hr*sc,XP=x+e1*sc;
 let poly=`<polygon points="${x},${y} ${XP},${y+HR} ${x+W},${y} ${x+W},${y+H2} ${x},${y+H1}" fill="#f8fafc" stroke="#111827" stroke-width="3"/>`;
 return base(txt(380,28,'Harja – sivupalan mittakuva',21,'bold')+poly+
 dimH(x,x+W,y-35,total.toFixed(1)+' cm')+
 dimH(x,XP,y-70,e1.toFixed(1)+' cm')+
 dimH(XP,x+W,y-70,e2.toFixed(1)+' cm')+
 dimV(x-52,y,y+H1,h1.toFixed(1)+' cm',-1)+
 dimV(XP+52,y,y+HR,hr.toFixed(1)+' cm',1)+
 dimV(x+W+52,y,y+H2,h2.toFixed(1)+' cm',1)+
 txt(380,435,'1. päädyn korkeus • 2. päädyn korkeus • harjakohdan korkeus',15));
}
function drawAll(){
 const visible=pieces.filter(p=>p.w!=null&&p.h!=null&&p.w>0&&p.h>0);
 let summary='';
 if(mode==='harja'){
   summary=`<div class="pieceinfo"><b>Harjan mitat:</b> leveys ${n('B29').toFixed(1)} cm, syvyys ${n('B30').toFixed(1)} cm, 1. pääty ${n('B33').toFixed(1)} cm, 2. pääty ${n('B34').toFixed(1)} cm, harjakohta ${n('B35').toFixed(1)} cm, etäisyydet ${n('B36').toFixed(1)} + ${n('B37').toFixed(1)} cm.</div>`;
 }
 $('allDrawings').innerHTML=summary+visible.map(p=>{
   let svg;
   if(mode==='lape'&&p.shape==='lapeSide'&&!p.name.endsWith(' 2'))svg=lapeSideDraw();
   else if(mode==='harja'&&p.shape==='harjaSide'&&!p.name.endsWith(' 2'))svg=harjaSideDraw();
   else svg=rectDraw(p.name,p.w,p.h);
   let info=`Leikkausmitta: ${p.w.toFixed(1)} × ${p.h.toFixed(1)} cm`;
   if(p.seam)info+=' — saumallinen pala';
   if(p.name==='Sivut')info+=' — 2 peilikuvapalaa';
   if(p.name==='Hatun jalka')info+=` — ${mode==='lape'?n('B17'):n('B44')} kpl`;
   return `<article class="piece-card"><h3>${p.name}</h3><div class="draw">${svg}</div><div class="pieceinfo">${info}</div></article>`;
 }).join('');
}

calc();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
